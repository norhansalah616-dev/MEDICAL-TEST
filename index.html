<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الماسح الذكي المدمج لتحضيرات التحاليل الطبية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    
    <!-- الربط مع ملف التحاليل الإضافية التخصصية DotCare -->
    <script src="dotcare.js"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #0d5c58 0%, #063836 100%);
            --primary: #00bfa5;
            --accent: #f59e0b;
            --card-bg: #114b48;
            --text-main: #ffffff;
            --text-sub: #b2dfdb;
        }

        /* حماية لمنع تحديد ونسخ محتوى الصفحة */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Cairo', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px 15px 80px;
            position: relative;
        }

        .container { max-width: 550px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 22px; }
        header h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 5px; }
        header p { font-size: 0.85rem; color: var(--text-sub); }

        .controls-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .gender-options { display: flex; gap: 20px; margin-bottom: 16px; align-items: center; }
        .gender-options label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; }

        .upload-area { display: flex; flex-direction: column; gap: 10px; }
        .btn-action {
            background-color: var(--primary);
            color: #00332c;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: block;
            width: 100%;
            transition: 0.2s;
        }
        .btn-action:hover { opacity: 0.92; }

        input[type="file"] { display: none; }

        #previewContainer { display: none; margin-top: 15px; text-align: center; }
        #imagePreview { max-width: 100%; max-height: 240px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2); pointer-events: none; }

        .rotate-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-sub {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 25, 30, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-card {
            background: rgba(12, 30, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px 30px;
            border-radius: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 48px; height: 48px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .results-section { margin-top: 20px; display: none; }
        .results-section h3 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); }

        .source-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-sub);
            font-weight: 700;
        }

        .test-result-card {
            background: #ffffff;
            color: #263238;
            border-radius: 12px;
            padding: 15px 18px;
            margin-bottom: 12px;
            border-right: 6px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            -webkit-user-select: text;
            user-select: text;
        }

        .test-result-card.warning-female { border-right-color: #e91e63; }
        .test-result-card h4 { color: #00796b; font-size: 1rem; margin-bottom: 6px; }
        .test-result-card p { font-size: 0.88rem; line-height: 1.6; }

        .alert-box {
            background: #ffebee;
            color: #c2185b;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 700;
            margin-top: 8px;
            font-size: 0.82rem;
            display: inline-block;
        }

        /* تذييل حقوق الملكية */
        footer {
            margin-top: 35px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 15px;
            font-size: 0.82rem;
            color: var(--text-sub);
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--accent);
            text-decoration: underline;
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">

<div class="container">
    <header>
        <h1>الماسح الذكي لتحضيرات التحاليل</h1>
        <p>فحص مباشر عبر معايير DotCare مدعوماً بالذكاء الاصطناعي</p>
    </header>

    <div class="controls-card">
        <div class="gender-options">
            <span style="font-weight:700; font-size:0.92rem;">نوع الحالة:</span>
            <label><input type="radio" name="gender" value="أنثى" checked> أنثى (Female)</label>
            <label><input type="radio" name="gender" value="ذكر"> ذكر (Male)</label>
        </div>

        <div class="upload-area">
            <label for="cameraInput" class="btn-action">📸 فتح الكاميرا وتصوير الروشتة</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="loadFile(this)">

            <label for="fileInput" class="btn-action" style="background-color: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);">📁 اختيار صورة من المعرض</label>
            <input type="file" id="fileInput" accept="image/*" onchange="loadFile(this)">
        </div>

        <div id="previewContainer">
            <img id="imagePreview" alt="معاينة الروشتة">
            <div class="rotate-bar">
                <button class="btn-sub" onclick="rotateManual(-90)">🔄 تدوير يسار</button>
                <button class="btn-sub" onclick="rotateManual(90)">🔄 تدوير يمين</button>
                <button class="btn-sub" style="background: var(--accent);" onclick="startHybridSmartScan()">🔍 إعادة الفحص</button>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <h3>جاري الفحص...</h3>
            <p id="loadingMsg" style="font-size: 0.85rem; color: #b2dfdb;">تحليل الروشتة ومطابقة شروط DotCare...</p>
        </div>
    </div>

    <div class="results-section" id="resultsSection">
        <div id="scanModeBadge" class="source-badge"></div>
        <h3>التحاليل المكتشفة وشروط التحضير:</h3>
        <div id="resultsList"></div>
    </div>

    <footer>
        <p>© جميع الحقوق محفوظة | تطوير: <a href="https://nourhan-salah.github.io/nour-portfolio/?fbclid=IwVERDUAUkwOlleHRuA2FlbQIxMABwZG9mAXNydGMGYXBwX2lkDDM1MDY4NTUzMTcyOAABHsaIO844ow-bJ2Vt8YZu7IGR-mvxl4y7vc3tKWOJz9f9nCc5Cy7K8wvr9Gw4_aem_ZfZ8NWbfFDZnPxrsO1x0Kg" target="_blank" rel="noopener noreferrer">نورهان صلاح (Nourhan Salah)</a></p>
    </footer>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>

<script>
    // ==========================================
    // 🛡️ حماية الكود المصدري من الاستعراض
    // ==========================================
    document.addEventListener('keydown', function (e) {
        if (
            e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
            (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))
        ) {
            e.preventDefault();
            return false;
        }
    });

    setInterval(function() {
        (function() {
            return false;
        }['constructor']('debugger')());
    }, 1500);

    // ==========================================
    // محرك الفحص والبيانات
    // ==========================================
    const _kPart1 = "QVEuQWI4Uk42STFPTkh4";
    const _kPart2 = "Y3JRUm8xMkowLTlNUVBM";
    const _kPart3 = "bm5vSTluZXhNTEhhckJY";
    const _kPart4 = "anl3aTdrd0E=";
    const getSecureKey = () => atob(_kPart1 + _kPart2 + _kPart3 + _kPart4);

    let rawImg = new Image();
    let currentAngle = 0;
    let currentFile = null;

    // التحاليل الأكثر طلباً وشيوعاً المباشرة داخل index.html
    const primaryCommonRules = [
        {
            name: "فيتامين د (Vitamin D / 25-OH) [204108]",
            test: (t) => /vitamin\s*d|vit\s*d|v\.d|25[-_ ]?oh|204108/i.test(t),
            getNotes: (isFemale) => isFemale 
                ? `سيرم دم لا يحتاج إلى صيام.<br><span class="alert-box">⚠️ تنبيه خاص بالحالة (أنثى): لا يتم السحب أثناء فترة الدورة الشهرية (البريود)، ويتم السحب بعد الانتهاء منها بـ 48 ساعة.</span>`
                : `سيرم دم لا يحتاج إلى صيام، مع تجنب تناول جرعات مكثفة من فيتامين د قبل الفحص بيومين.`
        },
        {
            name: "صورة دم كاملة (COMPLETE BLOOD PICTURE - CBC) [2090001]",
            test: (t) => /\bcbc\b|complete\s*blood\s*count|blood\s*picture|2090001/i.test(t),
            getNotes: () => `دم كامل على أنبوبة EDTA، لا يشترط الصيام، مع خلط الأنبوبة بلطف فور السحب.`
        },
        {
            name: "سكر صائم بالدم (FASTING BLOOD SUGAR - FBS) [2040001]",
            test: (t) => /fasting\s*blood\s*sugar|\bfbs\b|2040001/i.test(t),
            getNotes: () => `صيام من 6 إلى 8 ساعات (يسمح بشرب الماء فقط). تسحب العينة على أنبوبة فلوريد صوديوم لتثبيط تحلل الجلوكوز.`
        },
        {
            name: "سكر فاطر بعد ساعتين (POST PRANDIAL BLOOD SUGAR - 2H PP) [2040002]",
            test: (t) => /post\s*prandial|2\s*hours?\s*pp|\b2hpp\b|2040002/i.test(t),
            getNotes: () => `سحب العينة بعد ساعتين تماماً من بدء تناول الوجبة، ويمنع الأكل أو التدخين خلال الساعتين.`
        },
        {
            name: "سكر عشوائي بالدم (RANDOM Bl. SUGAR-RBS) [204076]",
            test: (t) => /random\s*bl(ood)?\.?\s*sugar|\brbs\b|204076/i.test(t),
            getNotes: () => `سيرم أو بلازما صوديوم فلوريد في أي وقت ولا يحتاج الى صيام؛ لتقييم مستويات الجلوكوز اللحظية والفرز الإسعافي.`
        },
        {
            name: "الهيموجلوبين السكري (HBA1C) [2040003]",
            test: (t) => /hba1c|glycated\s*hemoglobin|2040003/i.test(t),
            getNotes: () => `دم كامل EDTA، لا يشترط الصيام نهائياً؛ لتقييم متوسط ضبط السكر خلال الأشهر الثلاثة السابقة.`
        },
        {
            name: "الكرياتينين في مصل الدم (SERUM CREATININE) [2040005]",
            test: (t) => /serum\s*creatinine|creatinine(?!.*urine)|2040005/i.test(t),
            getNotes: () => `سيرم دم، يفضل تجنب الإفراط في اللحوم الحمراء والرياضة الشاقة قبل السحب، ولا يشترط الصيام التام.`
        },
        {
            name: "اليوريا في مصل الدم (UREA IN SERUM) [204023]",
            test: (t) => /urea\s*in\s*serum|serum\s*urea|\bbun\b|204023/i.test(t),
            getNotes: () => `سيرم لا يحتاج الى صيام؛ لتقييم وظائف الكلى الإطراحية وحالات الجفاف والنزف الهضمي ومتابعة الفشل الكلوي.`
        },
        {
            name: "حمض اليوريك / النقرس في مصل الدم (SERUM URIC ACID) [204086]",
            test: (t) => /serum\s*uric\s*acid|uric\s*acid|204086/i.test(t),
            getNotes: () => `سيرم لا يحتاج الى صيام؛ لتشخيص داء النقرس، وتسمم الحمل، وتقييم متلازمة انحلال الورم ومخاطر حصوات الكلى.`
        },
        {
            name: "إنزيم ناقلة أمين الألانين / وظائف كبد (SGPT [ ALT ]) [204089]",
            test: (t) => /\bsgpt\b|\balt\b|alanine\s*aminotransferase|204089/i.test(t),
            getNotes: () => `سيرم لا يحتاج الى صيام مع تجنب الإجهاد العضلي؛ المؤشر الكبدي الأخص لتقييم تلف خلايا الكبد وتأثير الأدوية والتهابات الفيروسات الكبدية.`
        },
        {
            name: "إنزيم ناقلة أمين الأسبارتات (SGOT [ AST ]) [2040020]",
            test: (t) => /\bsgot\b|\bast\b|aspartate\s*aminotransferase|2040020/i.test(t),
            getNotes: () => `سيرم دم لا يشترط الصيام، مع تجنب التدريبات العضلية الشاقة قبيل الفحص لتفادي الارتفاع العضلي.`
        },
        {
            name: "البيليروبين الكلي والمباشر (BILIRUBIN TOTAL & DIRECT) [2040022]",
            test: (t) => /bilirubin.*(total|direct)|total\s*(&|\/|\band\b)?\s*direct\s*bilirubin|2040022/i.test(t),
            getNotes: () => `سيرم دم صائم، مع ضرورة حماية العينة المسحوبة من الضوء الساطع لتفادي تكسر البيليروبين ضوئياً.`
        },
        {
            name: "الدهون الثلاثية في الدم (TRIGLYCERIDES) [204098]",
            test: (t) => /triglycerides?|\btg\b(?!.*antibodies)|204098/i.test(t),
            getNotes: () => `سيرم بعد صيام من 12-14 ساعة مسموح بشرب المياه فقط وتناول الأدوية؛ لتقييم مخاطر تصلب الشرايين والوقاية من التهاب البنكرياس.`
        },
        {
            name: "الكوليسترول الكلي (TOTAL CHOLESTEROL) [2040008]",
            test: (t) => /total\s*cholesterol|cholesterol\s*total|2040008/i.test(t),
            getNotes: () => `سيرم دم بعد صيام من 10 إلى 12 ساعة مع السماح بشرب الماء وتناول الأدوية المعتادة.`
        },
        {
            name: "كوليسترول عالي الكثافة (HDL CHOLESTEROL) [2040010]",
            test: (t) => /hdl[-_\s]*chol(esterol)?|2040010/i.test(t),
            getNotes: () => `سيرم دم بعد صيام من 10 إلى 12 ساعة؛ لتقييم مستوى الكوليسترول النافع والوقاية القلبية.`
        },
        {
            name: "كوليسترول منخفض الكثافة (LDL CHOLESTEROL) [2040015]",
            test: (t) => /ldl[-_\s]*chol(esterol)?|2040015/i.test(t),
            getNotes: () => `سيرم دم بعد صيام صارم من 10 إلى 12 ساعة؛ لتقييم الكوليسترول الضار المسبب لتصلب الشرايين.`
        },
        {
            name: "سرعة ترسيب الدم (ESR) [2090005]",
            test: (t) => /\besr\b|erythrocyte\s*sedimentation|2090005/i.test(t),
            getNotes: () => `دم على سترات الصوديوم أو EDTA؛ مؤشر غير نوعي للالتهابات ويقاس خلال الساعة الأولى والثانية.`
        },
        {
            name: "بروتين سي التفاعلي عالي الحساسية (CRP / HS-CRP) [2120001]",
            test: (t) => /\bcrp\b|c[-_ ]?reactive\s*protein|hs[-_ ]?crp|2120001/i.test(t),
            getNotes: () => `سيرم دم لا يشترط الصيام؛ واسم التهابي دقيق وسريع الارتفاع في العدوى الحادة والالتهابات الروماتيزمية.`
        },
        {
            name: "الفيريتين / مخزون الحديد في المصل (SERUM FERRITIN) [204081]",
            test: (t) => /serum\s*ferritin|ferritin|204081/i.test(t),
            getNotes: () => `سيرم، لا يشترط الصيام؛ المؤشر الأدق لتقييم مخزون الحديد بالجسم وبروتين طور حاد يرتفع بالالتهابات المزمنة.`
        },
        {
            name: "الحديد في مصل الدم (SERUM IRON) [204082]",
            test: (t) => /serum\s*iron|iron\s*level|\bfe\b.*serum|204082/i.test(t),
            getNotes: () => `سيرم لا يحتاج الى صيام مع إيقاف مكملات الحديد وتفادي تحلل الدم؛ يُطلب بالتزامن مع TIBC لتشخيص اضطرابات الحديد.`
        },
        {
            name: "الهرمون المنبه للغدة الدرقية (TSH) [210047]",
            test: (t) => /\btsh\b|thyroid\s*stimulating\s*hormone|210047/i.test(t),
            getNotes: () => `سيرم صباحي قبل تناول جرعة الثيروكسين لا يحتاج الى صيام؛ الفحص الاستقصائي الأول والأدق لفرز وتتبع اعتلالات الغدة الدرقية.`
        },
        {
            name: "الصوديوم في مصل الدم (SODIUM IN SERUM.) [204091]",
            test: (t) => /serum\s*sodium|sodium\s*in\s*serum|\bna\b.*serum|204091/i.test(t),
            getNotes: () => `سيرم مفصول فوراً لتفادي التحلل ولا يحتاج الى صيام؛ لتقييم توازن الأملاح، الجفاف، واختلال الضغط الأسمولي وأمراض الكلى والقلب.`
        },
        {
            name: "مستضد البروستاتا النوعي الكلي والحر (PSA TOTAL & FREE) [4431505]",
            test: (t) => /psa\s*total\s*(&|\/|\band\b)?\s*free|free\s*(&|\/|\band\b)?\s*total\s*psa|4431505/i.test(t),
            getNotes: () => `سيرم، مع الامتناع عن الجماع والقذف وركوب الدراجات والفحص الشرجي لمدة 48 ساعة؛ للتفريق بين سرطان وتضخم البروستاتا.`
        },
        {
            name: "مستضد البروستاتا النوعي الكلي (TOTAL PSA) [220014]",
            test: (t) => /total\s*psa|psa\s*total(?!.*free)|220014/i.test(t),
            getNotes: () => `سيرم لا يحتاج الى صيام مع تجنب الفحص الشرجي أو القذف لـ 48 ساعة؛ لمسح وتشخيص ومتابعة أورام وتضخم والتهابات البروستاتا.`
        },
        {
            name: "زمن الثرومبوبلاستين الجزئي المفعّل (PTT) [209069]",
            test: (t) => /\bptt\b|\baptt\b|partial\s*thromboplastin|209069/i.test(t),
            getNotes: () => `بلازما سترات الصوديوم (نسبة 9:1 مفصولة خلال ساعة) ولا تحتاج الى صيام؛ لمتابعة الهيبارين وتقييم التخثر وتشخيص الهيموفيليا.`
        },
        {
            name: "إنزيم الليباز في مصل الدم (SERUM LIPASE) [204083]",
            test: (t) => /serum\s*lipase|lipase\s*level|204083/i.test(t),
            getNotes: () => `سيرم لا يحتاج الى صيام؛ المعيار الأكثر نوعية وحساسية لتشخيص التهاب البنكرياس الحاد لاستمراره مرتفعاً فترة أطول من الأميلاز.`
        }
    ];

    // دمج قواعد التحاليل من القائمة الأساسية مع مصفوفة ملف dotcare.js
    const medicalRules = [
        ...primaryCommonRules,
        ...(typeof DOTCARE_EXTRA_TESTS !== 'undefined' ? DOTCARE_EXTRA_TESTS : [])
    ];

    function loadFile(input) {
        if (!input.files || !input.files[0]) return;
        currentFile = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            rawImg.onload = () => {
                currentAngle = 0;
                applyCanvasTransform();
                document.getElementById('previewContainer').style.display = 'block';
                startHybridSmartScan();
            };
            rawImg.src = e.target.result;
        };
        reader.readAsDataURL(currentFile);
    }

    function rotateManual(deg) {
        currentAngle = (currentAngle + deg) % 360;
        applyCanvasTransform();
    }

    function applyCanvasTransform() {
        const cvs = document.getElementById('procCanvas');
        const ctx = cvs.getContext('2d');
        const rad = (currentAngle * Math.PI) / 180;

        if (Math.abs(currentAngle) === 90 || Math.abs(currentAngle) === 270) {
            cvs.width = rawImg.height;
            cvs.height = rawImg.width;
        } else {
            cvs.width = rawImg.width;
            cvs.height = rawImg.height;
        }

        ctx.clearRect(0, 0, cvs.width, cvs.height);
        ctx.save();
        ctx.translate(cvs.width / 2, cvs.height / 2);
        ctx.rotate(rad);
        ctx.drawImage(rawImg, -rawImg.width / 2, -rawImg.height / 2);
        ctx.restore();

        document.getElementById('imagePreview').src = cvs.toDataURL();
    }

    // =========================================================================
    // ⚡ المحرك الهجين الذكي: Gemini يستخرج الأسماء + DotCare يطابق الشروط الرسمية
    // =========================================================================
    async function startHybridSmartScan() {
        const overlay = document.getElementById('loadingOverlay');
        const msg = document.getElementById('loadingMsg');
        overlay.style.display = 'flex';

        const cvs = document.getElementById('procCanvas');
        const base64Data = cvs.toDataURL('image/jpeg', 0.85).split(',')[1];
        const mimeType = 'image/jpeg';
        const isFemale = document.querySelector('input[name="gender"]:checked').value === 'أنثى';

        // 1. استخراج أسماء التحاليل المكتوبة بالروشتة عبر Gemini Vision
        msg.innerText = "🔍 جاري قراءة أسماء واختصارات التحاليل بالذكاء الاصطناعي...";
        const detectedTests = await extractTestNamesViaGemini(base64Data, mimeType);

        if (detectedTests && detectedTests.length > 0) {
            msg.innerText = "⚡ جاري استدعاء شروط التحضير من بنك DotCare...";
            
            const finalResults = [];

            detectedTests.forEach(item => {
                const queryText = (item.raw_name + " " + (item.code || "")).trim();
                
                // مطابقة التحليل مباشرة مع بنك قواعد DotCare
                const dotCareMatch = medicalRules.find(rule => rule.test(queryText));

                if (dotCareMatch) {
                    finalResults.push({
                        test_name: dotCareMatch.name,
                        instructions: dotCareMatch.getNotes(isFemale),
                        is_critical_female: dotCareMatch.name.includes("Vitamin D") && isFemale
                    });
                } else {
                    // تحليل احتياطي في حال كان خارج قواعد الدوت كير المسجلة
                    finalResults.push({
                        test_name: item.raw_name,
                        instructions: item.fallback_instructions || "لا توجد شروط تحضير خاصة مسجلة في نظام DotCare.",
                        is_critical_female: /vitamin\s*d|25-oh/i.test(item.raw_name) && isFemale
                    });
                }
            });

            displayResults(finalResults, "✨ تم التعرف عبر Gemini ومطابقة الشروط من بنك DotCare");
        } else {
            // الماسح المحلي الاحتياطي في حال تعذر الاتصال بالإنترنت
            msg.innerText = "التحول للماسح المحلي الاحتياطي...";
            await runLocalTesseractFallback();
        }

        overlay.style.display = 'none';
    }

    // دالة استخراج أسماء الفحوصات الطبية حصراً بواسطة Gemini
    async function extractTestNamesViaGemini(base64Image, mimeType) {
        const promptText = `
أنت خبير في قراءة الروشتات الطبية والفحوصات المعملية.
المهمة:
1. اقرأ الصورة بدقة واستخرج قائمة بأسماء كافة التحاليل الطبية المكتوبة (سواء خط يد أو مطبوع أو اختصارات مثل CBC, FBS, 2H PP, TSH, Vit D, SGPT, Urea).
2. اكتب الاسم الإنجليزي الواضح والاختصار لكل فحص.
3. اكتب شروطاً عامة ومختصرة كبديل احتياطي فقط في حال عدم وجود الفحص بالنظام المحلي.

أخرج النتيجة بصيغة JSON Array نقية فقط دون أي شروحات أو كتل markdown:
[
  {
    "raw_name": "اسم التحليل واختصاره بالإنجليزية",
    "code": "كود التحليل إن وُجد بالصورة",
    "fallback_instructions": "شروط مختصرة جداً"
  }
]`;

        const models = ["gemini-3.6-flash", "gemini-flash-latest"];

        for (const model of models) {
            try {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${getSecureKey()}`;
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inlineData: { mimeType: mimeType, data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                if (response.ok && data.candidates && data.candidates[0].content) {
                    let text = data.candidates[0].content.parts[0].text;
                    text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                    const results = JSON.parse(text);
                    if (Array.isArray(results) && results.length > 0) {
                        return results;
                    }
                }
            } catch (err) {
                console.warn("AI Extraction failed on model " + model + ":", err);
            }
        }
        return null;
    }

    // الماسح المحلي الاحتياطي (Tesseract OCR)
    async function runLocalTesseractFallback() {
        const cvs = document.getElementById('procCanvas');
        try {
            const result = await Tesseract.recognize(cvs, 'eng');
            const extractedText = result.data.text;

            const isFemale = document.querySelector('input[name="gender"]:checked').value === 'أنثى';
            const matched = medicalRules.filter(rule => rule.test(extractedText));

            if (matched.length > 0) {
                const formatted = matched.map(item => ({
                    test_name: item.name,
                    instructions: item.getNotes(isFemale),
                    is_critical_female: item.name.includes("Vitamin D") && isFemale
                }));
                displayResults(formatted, "🛡️ تم الفحص عبر المحرك المحلي الاحتياطي وقاعدة DotCare");
            } else {
                displayResults([], "المحرك المحلي لم يكتشف تحاليل واضحة، يرجى تعديل زاوية الصورة وإعادة الفحص.");
            }
        } catch (e) {
            alert("تعذر قراءة الصورة بالوسيلتين. يرجى التأكد من جودة الصورة.");
        }
    }

    function displayResults(tests, badgeText) {
        const badge = document.getElementById('scanModeBadge');
        const listDiv = document.getElementById('resultsList');
        const sec = document.getElementById('resultsSection');

        badge.innerText = badgeText;
        listDiv.innerHTML = '';

        if (!Array.isArray(tests) || tests.length === 0) {
            listDiv.innerHTML = '<div class="test-result-card"><p>لم يتم العثور على تحاليل مطابقة، يرجى تدوير الصورة لتصبح أفقية والضغط على (إعادة الفحص).</p></div>';
        } else {
            tests.forEach(item => {
                const card = document.createElement('div');
                card.className = `test-result-card ${item.is_critical_female ? 'warning-female' : ''}`;
                card.innerHTML = `
                    <h4>📋 ${item.test_name}</h4>
                    <p>${item.instructions}</p>
                    ${item.is_critical_female ? '<div class="alert-box">⚠️ تنبيه خاص بالحالة (أنثى): مراعاة موعد الدورة الشهرية (السحب بعدها بـ 48 ساعة)</div>' : ''}
                `;
                listDiv.appendChild(card);
            });
        }

        sec.style.display = 'block';
        sec.scrollIntoView({ behavior: 'smooth' });
    }
</script>
