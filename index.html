<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الماسح الذكي لتحضيرات التحاليل الطبية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #0d5c58 0%, #063836 100%);
            --primary: #00bfa5;
            --accent: #f59e0b;
            --card-bg: #114b48;
            --text-main: #ffffff;
            --text-sub: #b2dfdb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px 15px 60px;
        }

        .container { max-width: 580px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 22px; }
        header h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: 5px; }
        header p { font-size: 0.85rem; color: var(--text-sub); }

        .controls-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .gender-options { display: flex; gap: 20px; margin-bottom: 16px; align-items: center; }
        .gender-options label { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; }

        .upload-area { display: flex; flex-direction: column; gap: 10px; }
        .btn-action {
            background-color: var(--primary);
            color: #00332c;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: block;
            width: 100%;
            transition: 0.2s;
        }
        .btn-action:hover { opacity: 0.92; }

        input[type="file"] { display: none; }

        #previewContainer { display: none; margin-top: 15px; text-align: center; }
        #imagePreview { max-width: 100%; max-height: 240px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2); }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 25, 30, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-card {
            background: rgba(12, 30, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px 30px;
            border-radius: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 48px; height: 48px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .results-section { margin-top: 20px; display: none; }
        .results-section h3 { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent); }

        .test-result-card {
            background: #ffffff;
            color: #263238;
            border-radius: 12px;
            padding: 15px 18px;
            margin-bottom: 12px;
            border-right: 6px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .test-result-card.warning-female { border-right-color: #e91e63; }
        .test-result-card h4 { color: #00796b; font-size: 1rem; margin-bottom: 6px; }
        .test-result-card p { font-size: 0.88rem; line-height: 1.6; }

        .alert-box {
            background: #ffebee;
            color: #c2185b;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 700;
            margin-top: 8px;
            font-size: 0.82rem;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>الماسح الذكي لتحضيرات التحاليل</h1>
        <p>مسح بصري متقدم ومطابقة فورية بقواعد نظام DotCare المعتمدة</p>
    </header>

    <div class="controls-card">
        <div class="gender-options">
            <span style="font-weight:700; font-size:0.92rem;">نوع الحالة:</span>
            <label><input type="radio" name="gender" value="أنثى" checked> أنثى (Female)</label>
            <label><input type="radio" name="gender" value="ذكر"> ذكر (Male)</label>
        </div>

        <div class="upload-area">
            <label for="cameraInput" class="btn-action">📸 فتح الكاميرا وتصوير الروشتة</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processImage(this)">

            <label for="fileInput" class="btn-action" style="background-color: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3);">📁 اختيار صورة من المعرض</label>
            <input type="file" id="fileInput" accept="image/*" onchange="processImage(this)">
        </div>

        <div id="previewContainer">
            <img id="imagePreview" alt="معاينة الروشتة">
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <h3>جاري القراءة والمطابقة...</h3>
            <p id="loadingMsg" style="font-size: 0.85rem; color: #b2dfdb;">الذكاء الاصطناعي يقرأ الروشتة ومطابقتها بشروط DotCare...</p>
        </div>
    </div>

    <div class="results-section" id="resultsSection">
        <h3>التحاليل المكتشفة وشروط التحضير:</h3>
        <div id="resultsList"></div>
    </div>
</div>

<script>
    const _kPart1 = "QVEuQWI4Uk42STFPTkh4";
    const _kPart2 = "Y3JRUm8xMkowLTlNUVBM";
    const _kPart3 = "bm5vSTluZXhNTEhhckJY";
    const _kPart4 = "anl3aTdrd0E=";
    const getSecureKey = () => atob(_kPart1 + _kPart2 + _kPart3 + _kPart4);

    // بنك قواعد DotCare الشامل مدمج بالكامل مع تحاليل الشاشات 1 - 20
    const medicalRules = [
        // --- تحاليل شائعة وروتينية ---
        {
            name: "فيتامين د (Vitamin D / 25-OH)",
            test: (t) => /vitamin\s*d|vit\s*d|v\.d|25-oh/i.test(t),
            getNotes: (isFemale) => isFemale 
                ? `يفضل إجراؤه صباحاً.<br><span class="alert-box">⚠️ تنبيه خاص بالحالة (أنثى): لا يتم السحب أثناء فترة الدورة الشهرية (البريود)، ويتم السحب بعد الانتهاء منها بـ 48 ساعة.</span>`
                : `يفضل إجراؤه صباحاً، مع تجنب تناول جرعات مكثفة من فيتامين د قبل الفحص بيومين.`
        },
        {
            name: "سكر صائم (Fasting Blood Sugar - FBS)",
            test: (t) => /\b(fbs|fasting blood sugar)\b|fasting.*sugar/i.test(t),
            getNotes: () => `صيام تام من 6 إلى 8 ساعات كاملة (مسموح بشرب الماء النقي فقط، وممنوع التدخين أو المنبهات).`
        },
        {
            name: "سكر فاطر (PP Blood Sugar - 2h Post Prandial)",
            test: (t) => /pp\s*blood\s*sug|post\s*prandial|2\s*hours\s*post/i.test(t),
            getNotes: () => `يتم احتساب ساعتين بالضبط من بداية تناول وجبة طعام عادية أو جرعة الجلوكوز المقررة، ويُمنع الأكل تماماً خلال الساعتين حتى موعد السحب.`
        },
        {
            name: "سكر تراكمي (HbA1c / Glycosylated Hb)",
            test: (t) => /hba1c|glycosylated\s*hb|glycated/i.test(t),
            getNotes: () => `لا يشترط الصيام، ويتم سحب العينة في أي وقت لتقييم متوسط السكر لآخر 3 أشهر.`
        },
        {
            name: "سكر عشوائي (Random Blood Sugar - RBS)",
            test: (t) => /rand[ao]m\s*blood\s*sug|rbs/i.test(t),
            getNotes: () => `لا يشترط الصيام، ويتم سحب العينة في أي وقت خلال اليوم.`
        },
        {
            name: "صورة دم كاملة (CBC / Complete Blood Count)",
            test: (t) => /\bcbc\b|blood\s*picture|complete\s*blood/i.test(t),
            getNotes: () => `لا يشترط الصيام التام، ويفضل شرب كميات كافية من الماء وتجنب الإجهاد البدني العنيف قبل السحب.`
        },
        {
            name: "سرعة الترسيب (ESR)",
            test: (t) => /\besr\b|sedimentation\s*rate/i.test(t),
            getNotes: () => `لا يشترط الصيام التام، ويفضل إجراؤه صباحاً.`
        },
        {
            name: "بروتين سي التفاعلي الكمي (CRP QUANTITATIVE)",
            test: (t) => /\bcrp\b|c-reactive\s*protein/i.test(t),
            getNotes: () => `لا يشترط الصيام، ويفضل تجنب المجهود البدني الشديد قبل السحب.`
        },
        {
            name: "حمض البوليك / يوريك أسيد (Serum Uric Acid)",
            test: (t) => /uric\s*acid/i.test(t),
            getNotes: () => `صيام من 4 إلى 6 ساعات، مع الامتناع عن أكل اللحوم الحمراء والبقوليات بكثرة في اليوم السابق.`
        },
        {
            name: "كالسيوم متأين (CALCIUM IONIZED)",
            test: (t) => /calcium\s*\(?\s*ionized\s*\)?|ionized\s*ca/i.test(t),
            getNotes: () => `لا يشترط الصيام، ويفضل سحب العينة بدون ربط التورنيكيه لفترة طويلة وتُفصل في المختبر سريعاً.`
        },
        {
            name: "كالسيوم كلي (Serum Total Calcium)",
            test: (t) => /total\s*calcium|calcium\s*total/i.test(t),
            getNotes: () => `صيام خفيف 4 إلى 6 ساعات، مع تجنب أخذ مكملات الكالسيوم صباح يوم الفحص.`
        },
        {
            name: "ماغنسيوم في السيرم (MAGNESIUM in serum)",
            test: (t) => /magnesium/i.test(t),
            getNotes: () => `لا يشترط الصيام، وتجنب مكملات الماغنسيوم ومضادات الحموضة قبل الفحص بـ 24 ساعة.`
        },
        {
            name: "عامل الروماتويد الكمي (RHEUMATOID FACTOR QUANTITATIVE)",
            test: (t) => /rheumatoid\s*factor|\brf\b/i.test(t),
            getNotes: () => `لا يشترط الصيام التام، ويُفضل تجنب الوجبات الدسمة قبل السحب مباشرة.`
        },
        {
            name: "هرمون محفز الغدة الدرقية (TSH)",
            test: (t) => /\btsh\b|thyroid\s*stimulating/i.test(t),
            getNotes: () => `يُفضل سحبه صباحاً، وفي حال أخذ علاج هرمون الثيروكسين تُسحب العينة قبل تناول الجرعة الصباحية.`
        },
        {
            name: "هرمونات الغدة الدرقية الحرة (FREE T3 & FREE T4)",
            test: (t) => /free\s*t3|free\s*t4|\bft3\b|\bft4\b/i.test(t),
            getNotes: () => `تسحب صباحاً قبل تناول جرعة دواء الغدة، مع إبلاغ المختبر بأي مكملات تحتوي على البيوتين (Biotin).`
        },
        {
            name: "فيريتين / مخزون الحديد (Ferritin)",
            test: (t) => /ferritin|feletin/i.test(t),
            getNotes: () => `صيام خفيف 4 إلى 6 ساعات، ويفضل إجراؤه صباحاً وتجنب السحب أثناء نزلات البرد والالتهابات الحادة.`
        },
        {
            name: "وظائف كبد (Albumin / SGOT / AST / SGPT / ALT)",
            test: (t) => /\b(albumin|ast|sgot|alt|sgpt)\b/i.test(t),
            getNotes: () => `لا يشترط الصيام التام، ويفضل تجنب الأطعمة الدسمة في الوجبة السابقة للسحب مباشرة.`
        },
        {
            name: "وظائف كلى (Creatinine / BUN / Blood Urea Nitrogen)",
            test: (t) => /creatinin|creat\b|\bbun\b|urea/i.test(t),
            getNotes: () => `يفضل صيام خفيف من 4 إلى 6 ساعات، مع تجنب تناول كميات مفرطة من اللحوم الحمراء قبل الفحص بيوم.`
        },
        {
            name: "أملاح ومعادن الدم (Sodium / Potassium)",
            test: (t) => /potassium|sodium/i.test(t),
            getNotes: () => `لا يشترط الصيام، ولكن يلزم إبلاغ المعمل بأي أدوية ضغط أو مدرات بول تؤخذ بانتظام.`
        },
        {
            name: "تحليل بول كامل (Complete Urine Analysis)",
            test: (t) => /urine|urinalysis/i.test(t),
            getNotes: () => `عينة بول صباحية أولى، مع غسل المنطقة وتطهيرها بالماء، وأخذ عينة منتصف البول (Mid-stream) في عبوة معقمة.`
        },
        {
            name: "تحليل براز (Stool Analysis)",
            test: (t) => /stool/i.test(t),
            getNotes: () => `تجمع العينة في الوعاء المعقم بدون اختلاطها بماء المرحاض أو البول، وتُسلم للمختبر خلال ساعتين كحد أقصى.`
        },
        {
            name: "دهون الدم الكاملة (Cholesterol / Triglycerides / HDL / LDL)",
            test: (t) => /cholesterol|triglycerides|lipid\s*profile|\bhdl\b|\bldl\b/i.test(t),
            getNotes: () => `صيام تام من 10 إلى 12 ساعة كاملة (مسموح بالماء فقط)، وتجنب العشاء الدسم ليلة الفحص.`
        },
        {
            name: "كورتيزول صباحي / مسائي (Cortisol AM / PM)",
            test: (t) => /cortisol/i.test(t),
            getNotes: () => `الالتزام الصارم بالتوقيت: الصباحي (8 - 10 صباحاً) والمسائي (4 - 6 مساءً)، مع راحة تامة للمريض 20 دقيقة قبل السحب وتجنب أي توتر.`
        },
        {
            name: "إنزيم محول للأنجيوتنسين (ACE)",
            test: (t) => /\bace\b|angiotensin/i.test(t),
            getNotes: () => `صيام 8 إلى 12 ساعة (مسموح بالماء فقط). يمنع تناول أدوية الضغط المثبطة للإنزيم (ACE inhibitors) إلا بعد مراجعة الطبيب.`
        },

        // --- تحاليل DotCare من الصفحة 1 حتى 20 ---
        {
            name: "فوسفاتيز حمضي (ACID PHOSPHATASE) [204003]",
            test: (t) => /acid\s*phosphatase|204003|\bacp\b/i.test(t),
            getNotes: () => `يفضل صيام خفيف (4 إلى 6 ساعات). يمنع فحص أو تدليك البروستاتا قبل التحليل بـ 48 ساعة.`
        },
        {
            name: "هرمون موجه قشر الكظر مسائي (ACTH P.M) [2100010]",
            test: (t) => /acth\s*\(?p\.?m\)?|2100010/i.test(t),
            getNotes: () => `يسحب مساءً بدقة (4 - 8 مساءً) مع راحة تامة للمريض لمدة 30 دقيقة قبل السحب وتُنقل العينة مثلجة فوراً.`
        },
        {
            name: "هرمون موجه قشر الكظر صباحي (ACTH MORNING) [210004]",
            test: (t) => /acth\s*morning|acth\s*\(?a\.?m\)?|210004/i.test(t),
            getNotes: () => `يسحب صباحاً بدقة (8 - 10 صباحاً) مع راحة تامة 30 دقيقة وتجنب التوتر، وتُنقل العينة مثلجة فوراً.`
        },
        {
            name: "مقاومة البروتين سي المنشط (ACTIVATED PROTEIN C RESISTANCE) [209001]",
            test: (t) => /activated\s*protein\s*c|apcr|209001/i.test(t),
            getNotes: () => `لا يشترط الصيام التام. يمنع أخذ أدوية السيولة ومضادات التخثر إلا بتعليمات الطبيب المعالج.`
        },
        {
            name: "أداليموماب والأجسام المضادة (Adalimumab Trough level) [Root LABService290]",
            test: (t) => /adalimumab|humira/i.test(t),
            getNotes: () => `تسحب العينة قبل موعد جرعة الدواء التالية مباشرة (Trough Level) لقياس أدنى تركيز في الدم بدقة.`
        },
        {
            name: "إنزيم أدامتس (ADAMTS13) [3035710]",
            test: (t) => /adamts/i.test(t),
            getNotes: () => `يفضل أخذ العينة قبل البدء في نقل البلازما أو أخذ العلاجات المثبطة للمناعة.`
        },
        {
            name: "أدينوزين ديميناز (ADENOSINE-DEAMINASE) [204004]",
            test: (t) => /adenosine-?deaminase|\bada\b|204004/i.test(t),
            getNotes: () => `لا يشترط الصيام. ترسل العينة للمختبر فوراً وتفصل سريعاً لتفادي تحلل الإنزيم.`
        },
        {
            name: "الهرمون المانع لإدرار البول (ADH) [210005]",
            test: (t) => /\badh\b|antidiuretic|vasopressin|210005/i.test(t),
            getNotes: () => `صيام 8 إلى 12 ساعة مع الامتناع عن التدخين والمنبهات، وتحديد كمية السوائل حسب إرشادات الطبيب.`
        },
        {
            name: "أجسام مضادة لقشرة الكظر (Adrenal cortical antibodies) [Root LABService289]",
            test: (t) => /adrenal\s*cortical/i.test(t),
            getNotes: () => `لا يشترط الصيام التام، ويفضل تجنب الأطعمة الدسمة قبل السحب بعدة ساعات.`
        },
        {
            name: "زلال سائل الاستسقاء (ALBUMIN IN ASCITIC FLUID) [Root LABService77]",
            test: (t) => /albumin\s*in\s*ascitic/i.test(t),
            getNotes: () => `عينة سائل استسقاء تجمع بمعرفة الطبيب، وترسل فوراً للمختبر مع عينة دم متزامنة لحساب SAAG.`
        },
        {
            name: "زلال البول النوعي (ALBUMIN IN URINE [QUALITATIVE]) [221003]",
            test: (t) => /albumin\s*in\s*urine|221003/i.test(t),
            getNotes: () => `عينة بول صباحية أولى نظيفة، مع تجنب التمارين الرياضية الشاقة قبل التحليل.`
        },
        {
            name: "نسبة الزلال إلى الجلوبيولين (A/G RATIO) [2040018]",
            test: (t) => /albumin\/\s*globulin|a\/g\s*ratio|2040018/i.test(t),
            getNotes: () => `لا يشترط الصيام، ويفضل تجنب الوجبات الدسمة قبل سحب الدم مباشرة.`
        },
        {
            name: "نسبة الزلال إلى الكرياتينين في البول (ALBUMIN/CREATININE RATIO) [221004]",
            test: (t) => /albumin[\s/]*creatinine|\bacr\b|microalbumin|221004/i.test(t),
            getNotes: () => `عينة بول صباحية أولى نظيفة، وتجنب الإجهاد العضلي الشديد قبل الفحص بـ 24 ساعة.`
        },
        {
            name: "كحول الدم (ALCOHOL IN BLOOD) [207001]",
            test: (t) => /alcohol\s*in\s*blood|207001/i.test(t),
            getNotes: () => `تنبيه هام: يمنع تطهير موضع الوخز بمسحات الكحول الطبية ويستبدل بمطهر آخر كاليود أو الماء والصابون.`
        },
        {
            name: "كحول اللعاب (ALCOHOL IN SALIVA) [207002]",
            test: (t) => /alcohol\s*in\s*saliva|207002/i.test(t),
            getNotes: () => `الامتناع عن الأكل، الشرب، التدخين، وغسول الفم لمدة 15 إلى 20 دقيقة قبل أخذ المسحة.`
        },
        {
            name: "كحول البول (Alcohol in urine) [Root LABService15]",
            test: (t) => /alcohol\s*in\s*urine/i.test(t),
            getNotes: () => `عينة بول نظيفة في عبوة محكمة الإغلاق لمنع تطاير الكحول، وتسلم للمختبر فوراً.`
        },
        {
            name: "إنزيم ألدولاز (ALDOLASE) [204006]",

    function processImage(input) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];
        const reader = new FileReader();

        reader.onload = (e) => {
            document.getElementById('imagePreview').src = e.target.result;
            document.getElementById('previewContainer').style.display = 'block';

            const base64Data = e.target.result.split(',')[1];
            const mimeType = file.type || 'image/jpeg';
            extractTestsWithGemini(base64Data, mimeType);
        };
        reader.readAsDataURL(file);
    }

    async function extractTestsWithGemini(base64Image, mimeType) {
        const overlay = document.getElementById('loadingOverlay');
        overlay.style.display = 'flex';

        const promptText = `
أنت مدقق بيانات طبية واستشاري مختبرات بمستشفيات أندلسية (Andalusia Hospitals) ونظام DotCare.
المهمة الحصرية: قراءة واستخراج أسماء التحاليل الطبية المكتوبة بالصورة بدقة:
1. إذا كانت استمارة مطبوعة رسمية (Request Form بها Checkboxes ومربعات): استخرج فقط التحاليل التي تم التأشير عليها بعلامة (✔) أو خط بالقلم، أو التي كُتبت يدوياً بالقلم.
2. إذا كانت روشتة مكتوبة بخط يد الطبيب (Handwritten): اقرأ خط يد الطبيب المعقد واستخرج أسماء التحاليل المكتوبة بالإنجليزية.
3. إذا كانت روشتة مطبوعة عادية أو جدولاً: اقرأ جميع الفحوصات المذكورة في قسم الـ LAB.

أخرج النتيجة بصيغة JSON Array نقية تحتوي على مصفوفة نصوص لأسماء الفحوصات فقط دون أي نص إضافي، مثل:
["Complete Blood Count", "Serum Uric Acid", "CALCIUM IONIZED", "Bilirubin Total"]
`;

        try {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${getSecureKey()}`;
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inlineData: { mimeType: mimeType, data: base64Image } }
                        ]
                    }]
                })
            });

            const data = await response.json();
            overlay.style.display = 'none';

            if (response.ok && data.candidates && data.candidates[0].content) {
                let textResponse = data.candidates[0].content.parts[0].text;
                textResponse = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                const rawTestsList = JSON.parse(textResponse);
                
                matchAndDisplayMyRules(rawTestsList);
            } else {
                alert("تعذر قراءة الصورة: " + (data.error ? data.error.message : "خطأ غير متوقع"));
            }
        } catch (err) {
            overlay.style.display = 'none';
            alert("حدث خطأ أثناء فحص الصورة: " + err.message);
        }
    }

    function matchAndDisplayMyRules(testsArray) {
        const isFemale = document.querySelector('input[name="gender"]:checked').value === 'أنثى';
        const listDiv = document.getElementById('resultsList');
        const sec = document.getElementById('resultsSection');
        listDiv.innerHTML = '';

        const fullExtractedString = testsArray.join(" ");
        const matched = [];

        medicalRules.forEach(rule => {
            if (rule.test(fullExtractedString)) {
                matched.push({
                    name: rule.name,
                    notes: rule.getNotes(isFemale),
                    isWarning: rule.name.includes("Vitamin D") && isFemale
                });
            }
        });

        if (matched.length > 0) {
            matched.forEach(item => {
                const card = document.createElement('div');
                card.className = `test-result-card ${item.isWarning ? 'warning-female' : ''}`;
                card.innerHTML = `
                    <h4>📋 ${item.name}</h4>
                    <p>${item.notes}</p>
                `;
                listDiv.appendChild(card);
            });
        } else {
            listDiv.innerHTML = `
                <div class="test-result-card" style="border-right-color: #f59e0b;">
                    <h4>لم يتم العثور على شروط مسجلة للتحاليل الملتقطة</h4>
                    <p>التحاليل المكتشفة: <b>${testsArray.join("، ")}</b></p>
                </div>
            `;
        }

        sec.style.display = 'block';
        sec.scrollIntoView({ behavior: 'smooth' });
    }
